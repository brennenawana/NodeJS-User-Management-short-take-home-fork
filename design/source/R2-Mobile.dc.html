<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R2 · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#9A4208}a:hover{color:#6E2E04}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:.7}
:focus-visible{outline:3px solid #F27D26;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;position:relative;background:{{t.bg}};color:{{t.ink}};font-family:{{t.fontBody}};font-size:15px;line-height:1.45;display:flex;flex-direction:column;">

  <!-- Header -->
  <header style="flex:0 0 auto;box-sizing:border-box;padding:12px 16px;border-bottom:1px solid {{t.line}};background:{{t.bg}};">
    <div style="display:flex;align-items:center;gap:8px;">
      <a href="#" aria-label="Users home" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:{{t.ink}};min-height:44px;">
        <span style="width:32px;height:32px;border-radius:{{t.rSm}};background:{{t.accent}};display:inline-flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{t.onAccent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="5.5" r="2.5"></circle><circle cx="11" cy="6.5" r="2"></circle><path d="M1.5 13.5c.6-2.3 2.2-3.5 4-3.5s3.4 1.2 4 3.5"></path><path d="M10 13.5c.4-1.6 1.6-2.6 3-2.6 .7 0 1.2.2 1.6.5"></path></svg>
        </span>
        <span style="font-family:{{t.fontDisplay}};font-weight:700;font-size:16px;letter-spacing:{{t.track.name}};">Users</span>
      </a>
      <div role="group" aria-label="View" style="margin-left:auto;display:inline-flex;background:{{t.surface2}};border:1px solid {{t.line}};border-radius:{{t.rMd}};padding:2px;gap:2px;">
        <button type="button" aria-pressed="true" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:{{t.rSm}};border:0;font-weight:600;font-size:13px;background:{{t.surface}};color:{{t.ink}};box-shadow:0 1px 2px rgba(30,28,24,.12);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>
          Grid
        </button>
        <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:{{t.rSm}};border:0;font-weight:600;font-size:13px;background:transparent;color:{{t.muted}};">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"></path><circle cx="12" cy="11" r="2"></circle></svg>
          Map
        </button>
      </div>
      <button type="button" aria-label="{{themeLabel}}" aria-pressed="{{isDark}}" onClick="{{toggleTheme}}" style="width:44px;height:44px;border-radius:{{t.rMd}};border:1px solid {{t.line}};background:{{t.surface}};color:{{t.ink}};display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;">
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
        </sc-if>
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
      </button>
    </div>
    <label for="m-search" style="position:relative;display:block;margin-top:12px;">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:{{t.muted}};display:inline-flex;" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </span>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Search people</span>
      <input id="m-search" type="search" placeholder="Search by name or city" value="{{q}}" onInput="{{onSearch}}" style="box-sizing:border-box;width:100%;height:44px;border-radius:{{t.rMd}};border:1px solid {{t.line}};background:{{t.surface}};color:{{t.ink}};padding:0 12px 0 40px;font-size:16px;">
    </label>
  </header>

  <!-- Timezone strip, horizontal scroll -->
  <section aria-label="Time zones" style="flex:0 0 auto;padding:16px 0 0;">
    <div role="group" aria-label="Filter people by UTC offset" style="display:flex;gap:12px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;">
      <sc-for list="{{zones}}" as="z" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{z.active}}" onClick="{{z.pick}}" style="flex:0 0 168px;box-sizing:border-box;text-align:left;min-height:92px;padding:12px 16px 16px;border-radius:{{t.rLg}};border:1px solid {{z.border}};background:{{z.bg}};color:{{z.fg}};box-shadow:{{t.shadow}};display:flex;flex-direction:column;gap:4px;min-width:0;">
          <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
            <span style="font-weight:700;font-size:15px;">{{z.label}}</span>
            <span style="font-size:13px;color:{{z.sub}};">{{z.hint}}</span>
          </span>
          <span style="font-family:{{t.fontDisplay}};font-size:26px;font-weight:700;letter-spacing:{{t.track.clock}};line-height:1.1;font-variant-numeric:tabular-nums;">{{z.time}}</span>
          <span style="font-size:13px;color:{{z.sub}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{z.count}} · {{z.names}}</span>
        </button>
      </sc-for>
    </div>
  </section>

  <!-- Title row -->
  <div style="flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px 8px;">
    <h1 style="margin:0;font-family:{{t.fontDisplay}};font-size:20px;font-weight:800;letter-spacing:{{t.track.head}};line-height:1.2;">People</h1>
    <p style="margin:0;color:{{t.muted}};font-size:14px;">{{countLine}}</p>
    <sc-if value="{{zoneActive}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{clearZone}}" aria-label="Clear {{zoneName}} filter" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 12px;border-radius:{{t.rFull}};border:1px solid {{t.line}};background:{{t.surface}};color:{{t.ink}};font-weight:600;font-size:13px;">
        {{zoneName}}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </sc-if>
  </div>

  <!-- Single-column cards -->
  <main style="flex:1 1 auto;min-height:0;overflow:hidden;padding:0 16px 96px;box-sizing:border-box;">
    <sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{users}}" as="u" hint-placeholder-count="4">
          <li style="box-sizing:border-box;background:{{t.surface}};border:1px solid {{u.border}};border-radius:{{t.rLg}};box-shadow:{{t.shadow}};padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;">
            <div style="display:flex;align-items:center;gap:12px;">
              <button type="button" onClick="{{u.toggle}}" aria-expanded="{{u.expanded}}" style="flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:0;text-align:left;color:{{t.ink}};min-height:48px;border-radius:{{t.rMd}};">
                <span aria-hidden="true" style="flex:0 0 auto;width:48px;height:48px;border-radius:{{t.rFull}};background:{{u.avBg}};color:{{u.avFg}};display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.02em;">{{u.initials}}</span>
                <span style="min-width:0;display:block;">
                  <span style="display:block;font-family:{{t.fontDisplay}};font-weight:700;font-size:16px;letter-spacing:{{t.track.name}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{u.name}}</span>
                  <span style="display:block;font-size:13px;color:{{t.muted}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{u.place}}</span>
                </span>
              </button>
              <button type="button" aria-label="More actions for {{u.name}}" style="flex:0 0 auto;width:44px;height:44px;border-radius:{{t.rMd}};border:0;background:transparent;color:{{t.muted}};display:inline-flex;align-items:center;justify-content:center;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5.5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="18.5" r="1"></circle></svg>
              </button>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <div style="min-width:0;">
                <p style="margin:0;font-family:{{t.fontDisplay}};font-size:28px;font-weight:700;letter-spacing:{{t.track.clock}};line-height:1.1;font-variant-numeric:tabular-nums;">{{u.time}}</p>
                <p style="margin:4px 0 0;font-size:13px;color:{{t.muted}};">{{u.periodLine}}</p>
              </div>
              <!-- SkyChip -->
              <svg width="72" height="36" viewBox="0 0 72 36" role="img" aria-label="{{u.skyAria}}" style="flex:0 0 auto;">
                <rect x="0" y="0" width="72" height="36" rx="12" fill="{{u.skyBg}}"></rect>
                <sc-if value="{{u.isSun}}" hint-placeholder-val="{{ true }}">
                  <path d="{{u.rays}}" fill="none" stroke="{{u.disc}}" stroke-width="2.4" stroke-linecap="round"></path>
                  <circle cx="36" cy="{{u.sunY}}" r="{{u.sunR}}" fill="{{u.disc}}"></circle>
                </sc-if>
                <sc-if value="{{u.isNight}}" hint-placeholder-val="{{ false }}">
                  <circle cx="14" cy="9" r="1.3" fill="{{u.star}}"></circle>
                  <circle cx="52" cy="8" r="1.5" fill="{{u.star}}"></circle>
                  <circle cx="60" cy="17" r="1.1" fill="{{u.star}}"></circle>
                  <circle cx="23" cy="21" r=".9" fill="{{u.star}}"></circle>
                  <circle cx="35" cy="14" r="6.5" fill="{{u.disc}}"></circle>
                  <circle cx="38.2" cy="11.6" r="5.6" fill="{{u.skyBg}}"></circle>
                </sc-if>
                <sc-if value="{{u.hasGround}}" hint-placeholder-val="{{ true }}">
                  <path d="M.4 27H71.6A12 12 0 0 1 60 36H12A12 12 0 0 1 .4 27Z" fill="{{u.horizon}}"></path>
                </sc-if>
              </svg>
            </div>

            <sc-if value="{{u.expanded}}" hint-placeholder-val="{{ false }}">
              <div style="border-top:1px solid {{t.line}};padding-top:12px;display:flex;flex-direction:column;gap:12px;">
                <dl style="margin:0;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px 16px;">
                  <div><dt style="font-size:12px;font-weight:600;color:{{t.muted}};text-transform:uppercase;letter-spacing:.08em;">Location</dt><dd style="margin:2px 0 0;font-size:15px;font-weight:600;">{{u.place}}</dd></div>
                  <div><dt style="font-size:12px;font-weight:600;color:{{t.muted}};text-transform:uppercase;letter-spacing:.08em;">Zip</dt><dd style="margin:2px 0 0;font-size:15px;font-weight:600;">{{u.zip}}</dd></div>
                  <div style="grid-column:1 / -1;"><dt style="font-size:12px;font-weight:600;color:{{t.muted}};text-transform:uppercase;letter-spacing:.08em;">Coordinates</dt><dd style="margin:2px 0 0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;">{{u.coords}}</dd></div>
                </dl>
                <div style="display:flex;gap:8px;">
                  <button type="button" style="flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;border-radius:{{t.rMd}};border:1px solid {{t.line}};background:transparent;color:{{t.ink}};font-weight:600;font-size:14px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3Z"></path><path d="m13.5 7.5 3 3"></path></svg>
                    Edit
                  </button>
                  <button type="button" onClick="{{u.remove}}" style="flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;border-radius:{{t.rMd}};border:1px solid {{t.line}};background:transparent;color:{{t.error}};font-weight:600;font-size:14px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
                    Remove
                  </button>
                  <button type="button" onClick="{{u.toggle}}" aria-label="Collapse {{u.name}}" style="flex:0 0 44px;width:44px;height:44px;border-radius:{{t.rMd}};border:1px solid {{t.line}};background:transparent;color:{{t.muted}};display:inline-flex;align-items:center;justify-content:center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
                  </button>
                </div>
                <p style="margin:0;display:flex;align-items:center;gap:4px;font-size:13px;color:{{t.muted}};">
                  <span>Location updated {{u.updated}}</span>
                  <span aria-hidden="true">·</span>
                  <button type="button" onClick="{{u.refresh}}" style="min-height:44px;padding:0 8px;border-radius:{{t.rSm}};border:0;background:transparent;color:{{t.accentInk}};font-weight:600;font-size:13px;">Refresh location</button>
                </p>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
      <div style="box-sizing:border-box;border:1px dashed {{t.lineStrong}};border-radius:{{t.rLg}};padding:32px 16px;text-align:center;">
        <p style="margin:0 0 4px;font-family:{{t.fontDisplay}};font-weight:700;font-size:16px;letter-spacing:{{t.track.name}};">No one matches</p>
        <p style="margin:0 0 12px;color:{{t.muted}};font-size:14px;">Try a shorter name, or clear the filters.</p>
        <button type="button" onClick="{{clearFilters}}" style="min-height:44px;padding:0 16px;border-radius:{{t.rMd}};border:1px solid {{t.line}};background:transparent;color:{{t.ink}};font-weight:600;">Clear search and filters</button>
      </div>
    </sc-if>
  </main>

  <!-- Floating add button, thumb-reachable -->
  <button type="button" style="position:absolute;right:16px;bottom:16px;z-index:10;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border-radius:{{t.rFull}};border:0;background:{{t.accent}};color:{{t.onAccent}};font-weight:700;font-size:15px;box-shadow:{{t.shadow}};">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Add a person
  </button>

  <!-- Undo toast -->
  <sc-if value="{{toastOpen}}" hint-placeholder-val="{{ false }}">
    <div role="status" aria-live="polite" style="position:absolute;left:16px;right:16px;bottom:84px;z-index:20;display:flex;align-items:center;gap:8px;background:{{t.inverse}};color:{{t.onInverse}};border-radius:{{t.rMd}};padding:8px 8px 8px 16px;box-shadow:{{t.shadow}};box-sizing:border-box;">
      <span style="flex:1 1 auto;font-size:14px;font-weight:600;">{{toastText}}</span>
      <button type="button" onClick="{{undoRemove}}" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:{{t.rSm}};border:0;background:{{t.accent}};color:{{t.onAccent}};font-weight:700;font-size:14px;">Undo</button>
      <button type="button" aria-label="Dismiss" onClick="{{dismissToast}}" style="width:44px;height:44px;border-radius:{{t.rSm}};border:0;background:transparent;color:{{t.onInverse}};display:inline-flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#F27D26"},"font":{"editor":"enum","default":"Plus Jakarta Sans","options":["Plus Jakarta Sans","Figtree","DM Sans","Nunito","Bricolage Grotesque + Figtree"]},"$preview":{"width":390,"height":844}}'>

].map(u => Object.assign({}, u, ZIPS[u.zip]));

function hueOf(name) { let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
function avatarColors(name, dark) {

  return dark ? { bg: 'hsl(' + h + ' 28% 26%)', fg: 'hsl(' + h + ' 65% 84%)' } : { bg: 'hsl(' + h + ' 58% 90%)', fg: 'hsl(' + h + ' 55% 29%)' };
}
function initialsOf(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function hexToRgb(hex) {
  let h = (hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h || 'F27D26', 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function luminance(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function hueSatOf(hex) {
  const [r, g, b] = hexToRgb(hex).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0; if (d) { if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h = Math.round(h * 60); if (h < 0) h += 360; }
  const l = (max + min) / 2; const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return { h, s: Math.round(s * 100) };
}
function rgba(hex, a) { const c = hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function offsetLabel(off) {
  if (off == null) return 'UTC ?';
  const a = Math.abs(off), h = Math.floor(a / 3600), m = Math.round((a % 3600) / 60);
  return 'UTC' + (off < 0 ? '−' : '+') + h + (m ? ':' + String(m).padStart(2, '0') : '');
}
function zoneHint(off) { return HINTS[String(off)] || ''; }
function localClock(off, now) {
  const d = new Date(now.getTime() + off * 1000);
  const h = d.getUTCHours(), m = d.getUTCMinutes();
  return { h, m, text: (h % 12 || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM') };
}
// SkyChip geometry (72×36 viewBox) — identical to R2-Main
function raysPath(cx, cy, r1, r2, angles) {
  return angles.map(a => {
    const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
    return 'M' + (cx + r1 * c).toFixed(1) + ' ' + (cy + r1 * s).toFixed(1) + 'L' + (cx + r2 * c).toFixed(1) + ' ' + (cy + r2 * s).toFixed(1);
  }).join('');
}
const SKY_GEOM = {
  morning: { sunY: 20, sunR: 7, rays: raysPath(36, 20, 10, 14, [-150, -120, -90, -60, -30]), ground: true },
  afternoon: { sunY: 18, sunR: 7, rays: raysPath(36, 18, 10, 14, [0, 45, 90, 135, 180, 225, 270, 315]), ground: false },
  evening: { sunY: 27, sunR: 8, rays: raysPath(36, 27, 11, 14, [-125, -90, -55]), ground: true },
  night: { sunY: 0, sunR: 0, rays: '', ground: true }
};
function skyChip(period, T, city) {
  const key = period.toLowerCase(), pal = T.sky[key], g = SKY_GEOM[key];
  return { period, isNight: key === 'night', isSun: key !== 'night', hasGround: g.ground,
    skyBg: pal.bg, disc: pal.disc, horizon: pal.hz, star: T.sky.star, sunY: g.sunY, sunR: g.sunR, rays: g.rays,
    skyAria: city ? period + ' in ' + city : period, aria: city ? period + ' in ' + city : period };
}
function sky(h, m, T, city) {
  const t = h + m / 60;
  const isNight = t >= 21 || t < 5;
  const period = isNight ? 'Night' : t < 12 ? 'Morning' : t < 17 ? 'Afternoon' : 'Evening';
  return skyChip(period, T, city);
}
// Typeface options (font tweak) — identical to R2-Main
const FONTS = {
  'Plus Jakarta Sans': { body: "'Plus Jakarta Sans', system-ui, sans-serif", display: "'Plus Jakarta Sans', system-ui, sans-serif", track: { head: '-.02em', name: '-.01em', clock: '-.02em' } },
  'Figtree': { body: "'Figtree', system-ui, sans-serif", display: "'Figtree', system-ui, sans-serif", track: { head: '-.02em', name: '-.01em', clock: '-.02em' } },
  'DM Sans': { body: "'DM Sans', system-ui, sans-serif", display: "'DM Sans', system-ui, sans-serif", track: { head: '-.02em', name: '-.01em', clock: '-.02em' } },
  'Nunito': { body: "'Nunito', system-ui, sans-serif", display: "'Nunito', system-ui, sans-serif", track: { head: '-.01em', name: '0', clock: '-.01em' } },
  'Bricolage Grotesque + Figtree': { body: "'Figtree', system-ui, sans-serif", display: "'Bricolage Grotesque', 'Figtree', system-ui, sans-serif", track: { head: '-.03em', name: '-.02em', clock: '-.03em' } }
};
// ONE token object — identical to R2-Main
function tokens(dark, accent, font) {
  const hs = hueSatOf(accent);
  const f = FONTS[font] || FONTS['Plus Jakarta Sans'];
  const color = dark ? {
    bg: '#16181B', surface: '#1F2226', surface2: '#272B30', ink: '#F2F1EC', muted: '#B3B0A8', line: '#30353B', lineStrong: '#4A5058',
    ok: '#9FD9A8', okSoft: '#1F3326', error: '#FF8F86', errorSoft: '#3F2320', notice: '#F7E1CC', noticeSoft: '#3B3220',
    inverse: '#F2F1EC', onInverse: '#1F1D1A', land: '#30353B', coast: '#4A5058', grid: '#30353B', skel: '#2A2E34', skelHi: '#353A41',
    shadow: '0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6)'
  } : {
    bg: '#F4F5F1', surface: '#FFFFFF', surface2: '#ECEDE8', ink: '#1F1D1A', muted: '#5C5853', line: '#E4E3DC', lineStrong: '#C9C7BE',
    ok: '#1F6B3A', okSoft: '#E4F3E8', error: '#B42318', errorSoft: '#FDE8E6', notice: '#6E3A0A', noticeSoft: '#FFF1DC',
    inverse: '#1F1D1A', onInverse: '#F2F1EC', land: '#E4E3DC', coast: '#C9C7BE', grid: '#D9DBD3', skel: '#ECECE6', skelHi: '#F7F7F3',
    shadow: '0 1px 2px rgba(30,28,24,.05), 0 10px 28px -14px rgba(30,28,24,.16)'
  };
  return Object.assign(color, {
    accent, onAccent: luminance(accent) > 0.3 ? '#1F1D1A' : '#FFFFFF',
    accentInk: dark ? 'hsl(' + hs.h + ' ' + Math.min(95, hs.s + 10) + '% 72%)' : 'hsl(' + hs.h + ' ' + hs.s + '% 30%)',
    accentSoft: dark ? 'hsl(' + hs.h + ' 30% 20%)' : 'hsl(' + hs.h + ' 80% 94%)',
    bandFill: rgba(accent, dark ? 0.09 : 0.08),
    rSm: '8px', rMd: '12px', rLg: '20px', rFull: '999px',
    space: [4, 8, 12, 16, 20, 24, 32, 40, 48],
    type: { xs: 12, sm: 13, md: 14, base: 15, lg: 16, xl: 20, h1: 26, clock: 28 },
    fontBody: f.body, fontDisplay: f.display, track: f.track,
    sky: dark ? {
      morning: { bg: '#262B3F', disc: '#F2A43A', hz: '#4A3C22' }, afternoon: { bg: '#20364E', disc: '#F6B21B', hz: '#2C4560' },
      evening: { bg: '#42271E', disc: '#F28352', hz: '#5E382A' }, night: { bg: '#1A2038', disc: '#EEF1F8', hz: '#262E4C' }, star: '#9FB0E0'
    } : {
      morning: { bg: '#ECEEF8', disc: '#C9640A', hz: '#E8D3A8' }, afternoon: { bg: '#D6EAFC', disc: '#BE5F06', hz: '#BFDCF6' },
      evening: { bg: '#F8D5C6', disc: '#B5401A', hz: '#E3A58C' }, night: { bg: '#2B3350', disc: '#EEF1F8', hz: '#3A4466' }, star: '#C9D1EC'
    },
    skelFill: 'linear-gradient(90deg, ' + color.skel + ' 0%, ' + color.skelHi + ' 50%, ' + color.skel + ' 100%)'
  });
}

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { users: SEED.slice(), q: '', zone: null, flip: false, expandedId: 2, removed: null, toastOpen: false };
  }
  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 15000); }
  componentWillUnmount() { clearInterval(this.t); clearTimeout(this.toastT); }

  renderVals() {
    const s = this.state || {};
    const dark = (!!this.props.dark) !== (!!s.flip);
    const accent = this.props.accent || '#F27D26';
    const T = tokens(dark, accent, this.props.font);
    const now = new Date();

    const q = (s.q || '').trim().toLowerCase();
    const matches = u => (!q || u.name.toLowerCase().includes(q) || (u.city || '').toLowerCase().includes(q)) && (s.zone == null || u.offset === s.zone);
    const list = (s.users || []).filter(matches).slice().sort((a, b) => a.name.localeCompare(b.name));

    const users = list.map(u => {
      const av = avatarColors(u.name, dark);
      const lc = localClock(u.offset, now);
      const sk = sky(lc.h, lc.m, T, u.city);
      const expanded = s.expandedId === u.id;
      const hint = zoneHint(u.offset);
      return Object.assign({}, u, sk, {
        initials: initialsOf(u.name), avBg: av.bg, avFg: av.fg,
        time: lc.text, periodLine: sk.period + (hint ? ' · ' + hint : ''),
        place: u.city + ' · ' + offsetLabel(u.offset),
        coords: u.lat.toFixed(4) + ', ' + u.lon.toFixed(4),
        expanded, border: expanded ? T.accent : T.line,
        toggle: () => this.setState({ expandedId: expanded ? null : u.id }),
        refresh: () => this.setState({ users: s.users.map(x => x.id === u.id ? Object.assign({}, x, { updated: 'just now' }) : x) }),
        remove: () => {
          clearTimeout(this.toastT);
          this.setState({ users: s.users.filter(x => x.id !== u.id), removed: u, toastOpen: true, expandedId: expanded ? null : s.expandedId });
          this.toastT = setTimeout(() => this.setState({ toastOpen: false }), 7000);
        }
      });
    });
    const total = (s.users || []).length;

    const groups = {};
    (s.users || []).forEach(u => { (groups[u.offset] = groups[u.offset] || []).push(u); });
    const zones = Object.keys(groups).map(Number).sort((a, b) => a - b).map(off => {
      const members = groups[off]; const active = s.zone === off;
      return {
        label: offsetLabel(off), hint: zoneHint(off), time: localClock(off, now).text,
        count: members.length === 1 ? '1 person' : members.length + ' people',
        names: members.map(m => m.name.split(' ')[0]).join(', '),
        active, bg: active ? T.accent : T.surface, fg: active ? T.onAccent : T.ink, sub: active ? T.onAccent : T.muted, border: active ? T.accent : T.line,
        pick: () => this.setState({ zone: active ? null : off })
      };
    });

    return {
      t: T, q: s.q || '',
      isDark: dark, isLight: !dark, themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => this.setState({ flip: !s.flip }),
      countLine: (total === 1 ? '1 person' : total + ' people') + ((q || s.zone != null) && users.length !== total ? ' · ' + users.length + ' shown' : ''),
      zones, zoneActive: s.zone != null, zoneName: s.zone != null ? offsetLabel(s.zone) : '', clearZone: () => this.setState({ zone: null }),
      users, hasResults: users.length > 0, noResults: users.length === 0 && total > 0,
      onSearch: e => this.setState({ q: e.target.value }), clearFilters: () => this.setState({ q: '', zone: null }),
      toastOpen: !!s.toastOpen, toastText: s.removed ? s.removed.name + ' was removed.' : '',
      undoRemove: () => { clearTimeout(this.toastT); if (s.removed) this.setState({ users: s.users.concat([s.removed]), removed: null, toastOpen: false }); },
      dismissToast: () => { clearTimeout(this.toastT); this.setState({ toastOpen: false }); }
    };
  }
}
</script>
